# خادم الملفات الثابتة للـ Mini App + تمرير /api إلى الـ Backend.
# استبدل BACKEND_HOST بالعنوان الصحيح (اسم الخدمة في docker compose أو نطاقك).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # رؤوس أمان أساسية
    add_header X-Content-Type-Options "nosniff" always;
    # ملاحظة: X-Frame-Options: ALLOW-FROM مهجور ولا تدعمه المتصفحات الحديثة.
    # نستخدم CSP frame-ancestors بدلًا منه للسماح بالتضمين داخل تلجرام فقط.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # الملفات الثابتة مع كاش طويل (أسماء مُبصَّمة)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # تمرير API إلى الخادم
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:3000/health;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
